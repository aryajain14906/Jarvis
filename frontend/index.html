<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Jarvis Assistant</h1>

        <div class="input-row">

    <input
        type="text"
        id="question"
        placeholder="Ask me anything..."
    >

    <button id="micBtn">
        🎤
    </button>

    <button id="askBtn">
        Ask
    </button>

</div>

<div id="listening-status"></div>

        <div id="chat-history"></div>

        <div id="answer"></div>

    </div>
        <div id="voice-controls" style="margin-top: 10px;">
        <button id="voice-toggle-btn" onclick="toggleJarvisVoice()" aria-pressed="true">
            🔊 Voice: ON
        </button>
        <button id="voice-quality-btn" onclick="toggleVoiceQuality()">
            ⚡ Instant Voice (browser)
        </button>
    </div>
    <script src="script.js"></script>

</body>
</html>
